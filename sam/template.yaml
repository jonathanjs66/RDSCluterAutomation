AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless RDS Automation Pipeline

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30

Resources:

  # ── SNS ──────────────────────────────────────────────────────────
  RDSRequestTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: rds-request-topic

  # ── SQS ──────────────────────────────────────────────────────────
  RDSRequestDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: rds-request-dlq

  RDSRequestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: rds-request-queue
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RDSRequestDLQ.Arn
        maxReceiveCount: 3

  # Allow SNS to write into SQS
  RDSRequestQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref RDSRequestQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt RDSRequestQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref RDSRequestTopic

  # Wire SNS → SQS
  RDSRequestSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: sqs
      TopicArn: !Ref RDSRequestTopic
      Endpoint: !GetAtt RDSRequestQueue.Arn

  # ── API Gateway → SNS (direct integration, no middle Lambda) ─────
  ApiGatewayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: rds-automation-apigw-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SNSPublish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref RDSRequestTopic

  RDSApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      DefinitionBody:
        openapi: "3.0.1"
        info:
          title: RDS Automation API
          version: "1.0"
        paths:
          /request:
            post:
              responses:
                "200":
                  description: Request accepted
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:sns:action/Publish"
                credentials: !GetAtt ApiGatewayRole.Arn
                requestParameters:
                  integration.request.header.Content-Type: "'application/x-www-form-urlencoded'"
                requestTemplates:
                  application/json: !Sub "Action=Publish&TopicArn=$util.urlEncode('${RDSRequestTopic}')&Message=$util.urlEncode($input.body)"
                responses:
                  default:
                    statusCode: "200"
                    responseTemplates:
                      application/json: '{"message": "Request received"}'

  # ── Lambda ───────────────────────────────────────────────────────
  ProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: rds-automation-processor
      CodeUri: ../lambda/
      Handler: handler.lambda_handler
      Environment:
        Variables:
          SSM_GITHUB_TOKEN_PATH: /rds-automation/github-token
      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt RDSRequestQueue.QueueName
        - SSMParameterReadPolicy:
            ParameterName: rds-automation/github-token
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt RDSRequestQueue.Arn
            BatchSize: 1

Outputs:
  ApiUrl:
    Description: POST your JSON request here
    Value: !Sub "https://${RDSApi}.execute-api.${AWS::Region}.amazonaws.com/prod/request"
  TopicArn:
    Description: SNS Topic ARN
    Value: !Ref RDSRequestTopic
  QueueUrl:
    Description: SQS Queue URL
    Value: !Ref RDSRequestQueue
